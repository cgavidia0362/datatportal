<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Dealer YTD Report</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --navy:#0f172a;--navy-hover:#1e293b;--accent:#1e3a5f;
    --blue:#1e3a5f;--blue-lt:#eff6ff;
    --green:#15803d;--green-lt:#dcfce7;
    --red:#b91c1c;--red-lt:#fee2e2;
    --amber:#b45309;--amber-lt:#fef3c7;
    --border:#e5e7eb;--bg:#f3f4f6;--card:#fff;
    --text:#111827;--muted:#6b7280;
    --shadow:0 1px 2px rgba(17,24,39,.05);
    --font:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  }
  html,body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
  .page{max-width:860px;margin:0 auto;padding:20px 16px 56px}

  /* ── Header ── */
  .hdr{border-radius:12px;padding:22px 20px;margin-bottom:14px;background:var(--navy);box-shadow:var(--shadow)}
  .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:10px;font-weight:500}
  .hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .hdr-name{font-size:22px;font-weight:600;color:#fff;line-height:1.25;letter-spacing:-.02em}
  .hdr-sub{font-size:13px;color:rgba(255,255,255,.62);margin-top:4px}
  .hdr-pills{display:flex;gap:8px;flex-shrink:0}
  .hdr-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;text-align:center;min-width:72px}
  .hdr-pill-val{font-size:18px;font-weight:600;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
  .hdr-pill-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.5);margin-top:4px;font-weight:500}
  .yr-btns{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
  .yr-btn{font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:transparent;color:rgba(255,255,255,.7);cursor:pointer;font-family:var(--font)}
  .yr-btn.active{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}

  /* ── Controls ── */
  .controls{display:flex;gap:8px;margin-bottom:12px}
  .search-input{flex:1;padding:11px 14px;border-radius:10px;border:1px solid var(--border);font-size:14px;background:var(--card);color:var(--text);font-family:var(--font);outline:none;box-shadow:var(--shadow)}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,95,.12)}
  .search-input::placeholder{color:#94a3b8}

  /* ── Section label ── */
  .sec-lbl{font-size:12px;font-weight:500;letter-spacing:.04em;color:var(--muted);margin-bottom:10px}

  /* ── Dealer card ── */
  .dealer-list{display:flex;flex-direction:column;gap:10px}
  .dealer-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .card-hdr{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:56px;transition:background .15s}
  .card-hdr:hover{background:#f8fafc}
  .dealer-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.01em}
  .state-badge{display:inline-flex;align-items:center;margin-left:8px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:500;background:#f8fafc;border:1px solid #e2e8f0;color:#475569;vertical-align:middle}
  .dealer-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .funded-pill{font-size:12px;font-weight:600;color:var(--green);background:var(--green-lt);padding:5px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
  .funded-pill.zero{color:var(--muted);background:#f1f5f9}
  .chevron{font-size:10px;color:#94a3b8;transition:transform .2s;margin-left:8px;flex-shrink:0}
  .chevron.open{transform:rotate(180deg)}

  /* ── Stats grid (YTD) ── */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
  .sg{background:var(--card);padding:12px 6px;text-align:center;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .sg:nth-child(3n){border-right:none}
  .sg:nth-last-child(-n+3){border-bottom:none}
  .sg-val{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .sg-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:3px;font-weight:500}
  .sg.g .sg-val{color:var(--green)}
  .sg.b .sg-val{color:var(--accent)}
  .sg.r .sg-val{color:var(--red)}
  .sg.a .sg-val{color:var(--amber)}

  /* ── Current month box ── */
  .cur-wrap{margin:8px 10px 10px;border:1px solid #dbe4f0;border-radius:10px;overflow:hidden}
  .cur-hdr{background:#f8fafc;padding:9px 12px;display:flex;align-items:center;justify-content:space-between}
  .cur-hdr-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
  .live-dot{display:inline-block;width:6px;height:6px;background:#22c55e;border-radius:50%;margin-right:6px;vertical-align:middle}
  .cur-grid{display:grid;grid-template-columns:repeat(3,1fr)}
  .cg{background:var(--card);padding:11px 6px;text-align:center;border-top:1px solid var(--border);border-right:1px solid var(--border)}
  .cg:nth-child(3n){border-right:none}
  .cg-val{font-size:16px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
  .cg-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:3px;font-weight:500}
  .cg.g .cg-val{color:var(--green)}
  .cg.b .cg-val{color:var(--accent)}
  .cg.r .cg-val{color:var(--red)}
  .cg.a .cg-val{color:var(--amber)}

  /* ── Monthly breakdown ── */
  .monthly-wrap{display:none;border-top:1px solid var(--border)}
  .monthly-wrap.open{display:block}
  .monthly-inner{background:#f8fafc;padding:14px 14px 16px}
  .monthly-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
  .tbl-outer{position:relative}
  .tbl-scroll{overflow-x:auto;border-radius:10px;border:1px solid var(--border);background:#fff;-webkit-overflow-scrolling:touch}
  .scroll-hint{font-size:11px;color:var(--muted);text-align:center;padding:8px 0 0}
  .tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:480px}
  .tbl thead tr{background:#f8fafc}
  .tbl th{padding:9px 10px;text-align:right;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
  .tbl th:first-child{text-align:left;padding-left:12px}
  .tbl td{padding:9px 10px;text-align:right;color:#475569;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
  .tbl td:first-child{text-align:left;color:var(--text);font-weight:600;white-space:nowrap;padding-left:12px}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover td{background:#f8fafc}
  .tbl .gv{color:var(--green);font-weight:600}
  .tbl .rv{color:var(--red);font-weight:600}
  .tbl .bv{color:var(--accent)}
  .tbl tfoot td{background:#f8fafc;font-weight:600;color:var(--text);border-top:1px solid var(--border);border-bottom:none}
  .tbl tfoot td.gv{color:var(--green)}
  .tbl tfoot td.rv{color:var(--red)}
  .tbl tfoot td.bv{color:var(--accent)}

  /* ── Pagination ── */
  .pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;flex-wrap:wrap}
  .pg-btn{font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-family:var(--font);min-height:36px;box-shadow:var(--shadow)}
  .pg-btn:hover:not(:disabled):not(.active){background:#f8fafc}
  .pg-btn:disabled{opacity:.4;cursor:not-allowed}
  .pg-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}

  /* ── Loading ── */
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-wrap{text-align:center;padding:48px 0;color:var(--muted);font-size:13px}

  @media(max-width:640px){
    .page{padding:12px 12px 48px}
    .hdr{padding:18px 16px}
    .hdr-name{font-size:18px}
    .hdr-pills{width:100%}
    .hdr-pill{flex:1}
    .stats-grid{grid-template-columns:repeat(3,1fr)}
  }
</style>
</head>
<body>
<div class="page">
  <div class="hdr" id="mainHeader">
    <div class="brand">Buying Analysis Portal · Dealer Report</div>
    <div class="hdr-row">
      <div>
        <div class="hdr-name" id="hdrName">YTD Dealer Performance</div>
        <div class="hdr-sub" id="hdrSub">Loading…</div>
      </div>
      <div class="hdr-pills" id="hdrPills"></div>
    </div>
    <div class="yr-btns" id="yrBtns"></div>
  </div>

  <div class="controls">
    <input class="search-input" type="text" placeholder="Search dealer, state, or CIF…" id="searchInput" oninput="onSearch()"/>
  </div>

  <div class="sec-lbl" id="secLbl">Loading dealers…</div>
  <div class="dealer-list" id="dealerList">
    <div class="loading-wrap"><div class="spinner"></div><div style="margin-top:12px">Loading…</div></div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
const SB_URL = 'https://zhquyedaxszsnswaimza.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpocXV5ZWRheHN6c25zd2FpbXphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4OTYxNDcsImV4cCI6MjA3NjQ3MjE0N30.-XcpPuh_dexFjI1zSVLQfkDgvCEM6qlDN3ARTJBK3_4';
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const PER_PAGE = 10;
const sb = supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false}});

let allDealers = [], filtered = [], years = [];
let curYear = new Date().getFullYear(), curPage = 1, searchQ = '';

// ── Helpers ──────────────────────────────────────────────────────────────
function norm(s){ return (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim(); }
function normStatus(s){
  const t=(s||'').toLowerCase();
  if(t.includes('approv')||t.includes('booked')) return 'approved';
  if(t.includes('counter')) return 'counter';
  if(t.includes('pend')) return 'pending';
  if(t.includes('denial')||t.includes('denied')||t.includes('decline')) return 'denial';
  if(t.includes('fund')) return 'funded';
  return 'other';
}
function fmt(n){ return (n||0).toLocaleString(); }

// ── Load all data ─────────────────────────────────────────────────────────
async function load() {
  try {
    const {data:yrData} = await sb.from('monthly_snapshots').select('year').order('year',{ascending:false}).limit(5000);
    years = [...new Set((yrData||[]).map(r=>r.year))].sort((a,b)=>b-a);
    if(!years.length) years=[new Date().getFullYear()];
    curYear = years[0];
    buildYearBtns();
    await loadYear(curYear);
  } catch(e) {
    document.getElementById('dealerList').innerHTML = '<div class="loading-wrap" style="color:#dc2626">Failed to load: '+e.message+'</div>';
  }
}

function buildYearBtns(){
  document.getElementById('yrBtns').innerHTML = years.map(y=>
    `<button class="yr-btn ${y===curYear?'active':''}" onclick="switchYear(${y})">${y}</button>`
  ).join('');
}

async function loadYear(y) {
  curYear=y; curPage=1; searchQ=document.getElementById('searchInput').value.toLowerCase();
  const hdr=document.getElementById('mainHeader');
  hdr.className='hdr';
  document.querySelectorAll('.yr-btn').forEach(b=>{
    b.className='yr-btn'+(parseInt(b.textContent)===y?' active':'');
  });
  document.getElementById('hdrSub').textContent = y+' · Loading…';

  // ── Parallel fetch ──
  const [snapRes, retRes, masterRes, bdRes] = await Promise.all([
    fetchAllSnaps(y),
    sb.from('funding_returns').select('dealer,dealer_id,year,month').eq('year',y),
    sb.from('master_dealers').select('dealer_name,state,cifnumber,dealer_id'),
    sb.from('buying_daily_data').select('app_rows,funded_data').eq('id',1).maybeSingle()
  ]);

  // ── Build CIF map: norm(name)|state → cif ──
  const cifByDealer = new Map();   // norm(name)|state → cif
  const dealerByCif = new Map();   // cif → norm(name)|state
  const idByDealer  = new Map();   // norm(name)|state → dealer_id
  (masterRes.data||[]).forEach(d=>{
    const k = norm(d.dealer_name)+'|'+(d.state||'').toUpperCase();
    if(d.cifnumber){ cifByDealer.set(k, d.cifnumber); dealerByCif.set(d.cifnumber, k); }
    if(d.dealer_id)  idByDealer.set(k, d.dealer_id);
  });

  // ── Build returns maps (dealer_id first, name fallback) ──
  const retById   = new Map(); // dealer_id → {ytd, byMonth}
  const retByName = new Map(); // norm(dealer) → {ytd, byMonth}
  function addRet(map, key, month){
    if(!key) return;
    if(!map.has(key)) map.set(key,{ytd:0,byMonth:{}});
    const e=map.get(key); e.ytd++;
    e.byMonth[month]=(e.byMonth[month]||0)+1;
  }
  (retRes.data||[]).forEach(r=>{
    if(r.dealer_id) addRet(retById, r.dealer_id, r.month);
    addRet(retByName, norm(r.dealer), r.month);
  });

  // ── Build buying daily maps by CIF ──
  const bdApps    = new Map(); // cif → {total,approved,counter,pending,denial}
  const bdFunded  = new Map(); // cif → count
  let bdMonthLabel = null;

  if(bdRes?.data){
    const appRows = bdRes.data.app_rows||[];
    const fundedRows = bdRes.data.funded_data||[];

    // Detect month label from timestamps
    const mCounts={};
    appRows.forEach(r=>{
      if(!r.ts) return;
      const p=r.ts.split(/[\s\/]/);
      if(p.length>=3){ const k=(p[2]||'')+'-'+(p[0]||''); mCounts[k]=(mCounts[k]||0)+1; }
    });
    const top=Object.entries(mCounts).sort((a,b)=>b[1]-a[1])[0];
    if(top){ const [yr,mo]=top[0].split('-'); bdMonthLabel=MN[(parseInt(mo)||1)-1]+' '+(yr||curYear); }
    else { const n=new Date(); bdMonthLabel=MN[n.getMonth()]+' '+n.getFullYear(); }

    appRows.forEach(r=>{
      const cif=(r.cif||'').trim();
      if(!cif) return;
      if(!bdApps.has(cif)) bdApps.set(cif,{total:0,approved:0,counter:0,pending:0,denial:0});
      const s=bdApps.get(cif); s.total++;
      const st=normStatus(r.status||'');
      if(st==='approved') s.approved++;
      else if(st==='counter') s.counter++;
      else if(st==='pending') s.pending++;
      else if(st==='denial') s.denial++;
    });

    fundedRows.forEach(r=>{
      // Try CIF first, then name+state lookup
      let cif=(r.cif||'').trim();
      if(!cif){ cif=cifByDealer.get(norm(r.dealer)+'|'+(r.state||'').toUpperCase())||''; }
      if(cif) bdFunded.set(cif,(bdFunded.get(cif)||0)+1);
    });
  }

  // ── Aggregate snapshots by dealer ──
  const dealerMap = new Map();
  (snapRes||[]).forEach(r=>{
    const key=norm(r.dealer)+'|'+(r.state||'').toUpperCase();
    if(!dealerMap.has(key)) dealerMap.set(key,{
      name:r.dealer,state:r.state,
      apps:0,approved:0,counter:0,pending:0,denial:0,funded:0,
      months:[]
    });
    const d=dealerMap.get(key);
    d.apps     +=(r.total_apps||0);
    d.approved +=(r.approved||0);
    d.counter  +=(r.counter||0);
    d.pending  +=(r.pending||0);
    d.denial   +=(r.denial||0);
    d.funded   +=(r.funded||0);
    if((r.total_apps||0)>0||(r.funded||0)>0){
      d.months.push({
        month:r.month,
        apps:r.total_apps||0,
        approved:r.approved||0,
        counter:r.counter||0,
        pending:r.pending||0,
        denial:r.denial||0,
        funded:r.funded||0
      });
    }
  });

  // ── Build final dealer list ──
  allDealers = Array.from(dealerMap.entries()).map(([key, d])=>{
    const cif      = cifByDealer.get(key)||'';
    const dealerId = idByDealer.get(key)||null;
    const ret = (dealerId && retById.get(dealerId)) || retByName.get(norm(d.name)) || {ytd:0,byMonth:{}};
    const bd  = cif ? { apps:bdApps.get(cif)||null, funded:bdFunded.get(cif)||0 } : null;
    // Sort months
    d.months.sort((a,b)=>a.month-b.month);
    return {
      ...d,
      cif,
      returnsYtd: ret.ytd,
      returnsByMonth: ret.byMonth,
      bdApps: bd?.apps||null,
      bdFunded: bd?.funded||0,
      bdMonthLabel,
      ltb: d.apps?(d.funded/d.apps*100).toFixed(1):'0.0',
      lta: d.apps?((d.approved+d.counter)/d.apps*100).toFixed(1):'0.0'
    };
  }).sort((a,b)=>a.name.localeCompare(b.name));

  // Update header pills with totals
  const totFunded = allDealers.reduce((s,d)=>s+d.funded,0);
  const totApps   = allDealers.reduce((s,d)=>s+d.apps,0);
  document.getElementById('hdrSub').textContent    = y+' · '+allDealers.length+' dealers';
  const pills = document.getElementById('hdrPills');
  if (pills) {
    pills.innerHTML =
      '<div class="hdr-pill"><div class="hdr-pill-val">'+fmt(allDealers.length)+'</div><div class="hdr-pill-lbl">Dealers</div></div>'+
      '<div class="hdr-pill"><div class="hdr-pill-val">'+fmt(totApps)+'</div><div class="hdr-pill-lbl">Apps YTD</div></div>'+
      '<div class="hdr-pill"><div class="hdr-pill-val">'+fmt(totFunded)+'</div><div class="hdr-pill-lbl">Funded YTD</div></div>';
  }

  applyFilter();
}

async function fetchAllSnaps(y){
  let rows=[], from=0;
  while(true){
    const {data,error}=await sb.from('monthly_snapshots')
      .select('dealer,state,month,total_apps,approved,counter,pending,denial,funded')
      .eq('year',y).order('month',{ascending:true})
      .range(from,from+999);
    if(error) break;
    if(!data||!data.length) break;
    rows=rows.concat(data);
    if(data.length<1000) break;
    from+=1000;
  }
  return rows;
}

function switchYear(y){ loadYear(y); }

function onSearch(){
  searchQ=document.getElementById('searchInput').value.toLowerCase();
  curPage=1; applyFilter();
}

function applyFilter(){
  filtered=searchQ?allDealers.filter(d=>
    d.name.toLowerCase().includes(searchQ) ||
    String(d.state||'').toLowerCase().includes(searchQ) ||
    String(d.cif||'').toLowerCase().includes(searchQ)
  ):[...allDealers];
  renderPage();
}

function renderPage(){
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(curPage>pages) curPage=pages;
  const slice=filtered.slice((curPage-1)*PER_PAGE, curPage*PER_PAGE);

  document.getElementById('secLbl').textContent =
    total+' dealer'+(total!==1?'s':'')+' · sorted A–Z'+(pages>1?' · page '+curPage+' of '+pages:'');

  document.getElementById('dealerList').innerHTML = slice.map(d=>{
    // ── Stats grid ──
    const statsHTML = `
      <div class="stats-grid">
        <div class="sg"><div class="sg-val">${fmt(d.apps)}</div><div class="sg-lbl">Apps YTD</div></div>
        <div class="sg b"><div class="sg-val">${fmt(d.approved)}</div><div class="sg-lbl">Approved</div></div>
        <div class="sg a"><div class="sg-val">${fmt(d.counter)}</div><div class="sg-lbl">Counter</div></div>
        <div class="sg"><div class="sg-val">${fmt(d.pending)}</div><div class="sg-lbl">Pending</div></div>
        <div class="sg r"><div class="sg-val">${fmt(d.denial)}</div><div class="sg-lbl">Denial</div></div>
        <div class="sg g"><div class="sg-val">${fmt(d.funded)}</div><div class="sg-lbl">Funded</div></div>
        <div class="sg r"><div class="sg-val">${d.returnsYtd||'—'}</div><div class="sg-lbl">Returns YTD</div></div>
        <div class="sg b"><div class="sg-val">${d.lta}%</div><div class="sg-lbl">LTA</div></div>
        <div class="sg b"><div class="sg-val">${d.ltb}%</div><div class="sg-lbl">LTB</div></div>
      </div>`;

    // ── Monthly breakdown (includes current month, shown in dropdown) ──
    let monthlyHTML = '';
    if(d.months.length || d.bdApps || d.bdFunded){
      const rows = d.months.map(m=>`
        <tr>
          <td>${MN[m.month-1]} ${curYear}</td>
          <td>${fmt(m.apps)}</td>
          <td class="bv">${fmt(m.approved)}</td>
          <td>${fmt(m.counter)}</td>
          <td>${fmt(m.pending)}</td>
          <td class="rv">${fmt(m.denial)}</td>
          <td class="gv">${fmt(m.funded)}</td>
          <td class="rv">${d.returnsByMonth[m.month]||'—'}</td>
        </tr>`).join('');

      // Current month block (inside dropdown)
      let curInner = '';
      if(d.bdApps || d.bdFunded){
        const ba = d.bdApps||{total:0,approved:0,counter:0,pending:0,denial:0};
        curInner = `
          <div class="cur-wrap" style="margin:0 0 12px 0">
            <div class="cur-hdr">
              <span class="cur-hdr-lbl"><span class="live-dot"></span>${d.bdMonthLabel||'Current month'} — buying daily</span>
              <span style="font-size:9px;color:var(--blue);font-family:var(--mono);font-weight:500">LIVE</span>
            </div>
            <div class="cur-grid">
              <div class="cg"><div class="cg-val">${fmt(ba.total)}</div><div class="cg-lbl">Apps</div></div>
              <div class="cg b"><div class="cg-val">${fmt(ba.approved)}</div><div class="cg-lbl">Approved</div></div>
              <div class="cg a"><div class="cg-val">${fmt(ba.counter)}</div><div class="cg-lbl">Counter</div></div>
              <div class="cg"><div class="cg-val">${fmt(ba.pending)}</div><div class="cg-lbl">Pending</div></div>
              <div class="cg r"><div class="cg-val">${fmt(ba.denial)}</div><div class="cg-lbl">Denial</div></div>
              <div class="cg g"><div class="cg-val">${fmt(d.bdFunded)}</div><div class="cg-lbl">Funded</div></div>
            </div>
          </div>`;
      }

      const tblHTML = d.months.length ? `
        <div class="monthly-title">Monthly breakdown</div>
        <div class="tbl-outer">
          <div class="tbl-scroll">
            <table class="tbl">
              <thead>
                <tr>
                  <th>Month</th><th>Apps</th><th>Approv</th><th>Counter</th>
                  <th>Pending</th><th>Denial</th><th>Funded</th><th>Returns</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="scroll-hint">← swipe to see all columns →</div>
        </div>` : '';

      monthlyHTML = `
        <div class="monthly-wrap">
          <div class="monthly-inner">
            ${curInner}
            ${tblHTML}
          </div>
        </div>`;
    }

    return `
      <div class="dealer-card">
        <div class="card-hdr" onclick="toggleCard(this)">
          <div style="flex:1;min-width:0">
            <div class="dealer-name">${d.name}${d.state ? ' <span class="state-badge">'+d.state+'</span>' : ''}</div>
            <div class="dealer-meta">${d.cif?'CIF '+d.cif:''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="${d.funded ? 'funded-pill' : 'funded-pill zero'}">${fmt(d.funded)} funded</span>
            <span class="chevron">▼</span>
          </div>
        </div>
        ${statsHTML}
        ${monthlyHTML}
      </div>`;
  }).join('')||'<div class="loading-wrap">No dealers found.</div>';

  renderPagination(pages);
}

function renderPagination(pages){
  const el=document.getElementById('pagination');
  if(pages<=1){el.innerHTML='';return;}
  let html=`<button class="pg-btn" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>← Prev</button>`;
  const range=[];
  for(let p=1;p<=pages;p++){
    if(p===1||p===pages||(p>=curPage-1&&p<=curPage+1)) range.push(p);
    else if(range[range.length-1]!=='…') range.push('…');
  }
  range.forEach(p=>{
    if(p==='…') html+=`<span style="font-size:12px;color:var(--muted)">…</span>`;
    else html+=`<button class="pg-btn ${p===curPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html+=`<button class="pg-btn" onclick="goPage(${curPage+1})" ${curPage===pages?'disabled':''}>Next →</button>`;
  el.innerHTML=html;
}

function goPage(p){
  const pages=Math.ceil(filtered.length/PER_PAGE);
  if(p<1||p>pages) return;
  curPage=p; window.scrollTo(0,0); renderPage();
}

function toggleCard(hdr){
  const monthly=hdr.parentElement.querySelector('.monthly-wrap');
  if(!monthly) return;
  const chev=hdr.querySelector('.chevron');
  const open=monthly.classList.toggle('open');
  if(chev) chev.classList.toggle('open',open);
}

load();
</script>
</body>
</html>
